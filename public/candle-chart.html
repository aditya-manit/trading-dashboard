<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC/USDT · 4H · Volume Candles</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:'JetBrains Mono',monospace}
#root{display:flex;flex-direction:column;width:100%;height:100%}
#legend{position:absolute;top:8px;left:10px;z-index:5;display:flex;flex-direction:column;gap:3px;pointer-events:none;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
#legend > *{pointer-events:auto}
#symrow{display:flex;flex-direction:column;gap:3px;width:max-content}
.kicker{display:flex;align-items:center;gap:7px}
.krule{width:12px;height:2px;border-radius:1px;background:#f7931a;flex-shrink:0}
.mainrow{display:inline-flex;align-items:flex-start;gap:10px}
.coin{width:32px;height:32px;border-radius:50%;background:#f7931a;color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.symtxt{font-size:29px;font-weight:450;color:#131722;letter-spacing:-1px;line-height:1}
.sep{display:none}
.symtf{font-size:18px;font-weight:700;color:#f7931a;letter-spacing:.1px;margin-top:3px}
.symex{font-size:9.5px;font-weight:700;color:#a3a8b3;letter-spacing:1.4px;text-transform:uppercase}
#lvlChips{position:absolute;top:8px;left:clamp(300px,22%,360px);right:clamp(96px,22%,360px);z-index:6;display:flex;align-items:center;justify-content:center;gap:12px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
/* the rail: chips sit at their true price positions */
.lvlrail{position:relative;flex:1;min-width:0;height:28px}
.lvlrail.flat{display:inline-flex;align-items:stretch;justify-content:center;gap:0;flex:0 0 auto;
  min-width:max-content;height:auto;background:transparent;box-shadow:none}
/* the capsule surface owns the chips AND the fill cell */
#lvlChips.capsule{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 190px);
  gap:0;background:#fff;border-radius:9px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(26,24,19,.09),0 1px 2px rgba(26,24,19,.06)}
.lvlrail.flat .railline,.lvlrail.flat .railtick{display:none}
.lvlrail.flat .lchip{position:static!important;left:auto!important;transform:none!important;top:auto!important;border-radius:0;
  background:transparent;box-shadow:none;padding:4px 10px;height:auto}
.lvlrail.flat .lchip + .lchip{box-shadow:inset 1px 0 0 #eeebe6}
.lvlrail.flat .lchip:hover{background:#faf9f7}
.lvlrail.flat + .cdiv{display:none}
#lvlChips.capsule .fmeterwrap{gap:7px;padding:0 11px;box-shadow:inset 1px 0 0 #eeebe6;align-self:stretch}
#lvlChips.capsule .fmeter,#lvlChips.capsule .fmicon{display:none}
#lvlChips.capsule .fmdots{display:flex;gap:2.5px}
.fmdots{display:none}
.fmdots i{width:4px;height:4px;border-radius:50%;background:#7c5cff;display:block}
.fmdots i.off{background:#e6ddff}
.lvlrail .railline{position:absolute;left:0;right:0;top:13px;height:1px;background:#e3d9d8}
.lchip{position:absolute;top:13px;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:550;
  letter-spacing:-.1px;padding:3px 8px;border-radius:100px;border:none;cursor:pointer;background:#fff;
  color:#9aa0ab;white-space:nowrap;z-index:3;
  box-shadow:0 0 0 1px rgba(26,24,19,.07),0 1px 3px rgba(26,24,19,.05);
  transform:translateY(-50%);
  transition:background .14s ease,color .14s ease,box-shadow .14s ease}
.lchip .ldot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.35;transition:opacity .14s ease}
.lchip.on .ldot{opacity:1}
.lchip .lpx{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;opacity:.62;letter-spacing:-.2px}
.lchip:hover{transform:translateY(calc(-50% - 1px))}
.lchip:active{transform:translateY(-50%) scale(.96)}
.railtick{position:absolute;top:22px;width:1px;height:5px;background:#ded4d2}
.cdiv{width:1px;height:14px;background:#e0e3eb;align-self:center;flex-shrink:0}
.fmeter{display:flex;align-items:center;gap:2px;min-width:0}
.fmicon{display:inline-flex;align-items:center;color:#7c5cff;opacity:.9;cursor:default;margin-left:2px}
.fmicon:hover{opacity:1}
.fmeter span{height:5px;border-radius:1.5px;background:#7c5cff;opacity:.85}
.fmeter span.rest{background:#e6ddff;opacity:1}
.fchip{font-variant-numeric:tabular-nums}
#fetchbar{display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:20;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#fff;
  border-bottom:1px solid #eceef2;padding:8px 12px}
.fgrp{display:inline-flex;align-items:stretch;background:#f6f7f9;border:1px solid #e8eaef;border-radius:8px;overflow:hidden}
.fseg{font-family:inherit;font-size:11.5px;font-weight:600;color:#131722;background:transparent;border:none;
  padding:5px 9px;outline:none;cursor:pointer;transition:background .13s}
.fseg:hover{background:#eef0f4}
.fseg:focus{background:#fff;box-shadow:inset 0 0 0 1.5px #7c5cff}
.fcon{width:86px;cursor:text;letter-spacing:-.1px}
.fsel{-webkit-appearance:none;appearance:none;padding-right:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%23787b86' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center}
.fvr{width:1px;background:#e8eaef;flex-shrink:0}
.fwrap{position:relative;display:inline-flex}
.frange{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13px;font-weight:600;
  color:#0e1420;background:none;border:none;border-radius:0;padding:0 1px 4px;cursor:pointer;
  border-bottom:1.5px solid #131722;line-height:1;
  transition:border-color .14s,color .14s}
.frange:hover{border-bottom-color:#7c5cff}
.frange.open{border-bottom-color:#7c5cff;color:#7c5cff}
.frange svg{display:none}
.rgcv{color:#9aa0ab;flex-shrink:0;margin-left:-2px;transition:transform .16s ease,color .14s}
.frange:hover .rgcv,.frange.open .rgcv{color:#7c5cff}
.frange.open .rgcv{transform:rotate(180deg)}
#fRangeTxt{display:inline-flex;align-items:center;gap:8px}
.rgdate{font-variant-numeric:tabular-nums;letter-spacing:-.1px;font-size:13px;font-weight:600}
.rgarrow{color:#9aa0ab;font-size:11px;margin:0 -2px}
.rglive{color:#00a37a;font-weight:700;font-size:13px}
.flivedot{position:relative;width:5px;height:5px;border-radius:50%;background:#00c48c;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(0,196,140,.35)}
.flivedot::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1.5px solid #00c48c;opacity:.7;animation:livering 1.8s ease-out infinite}
@keyframes livering{0%{transform:scale(.6);opacity:.55}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.fbtn{font-family:inherit;font-size:11.5px;font-weight:650;color:#fff;background:#7c5cff;border:none;
  border-radius:8px;padding:6px 14px;cursor:pointer;transition:background .13s}
.fbtn:hover{background:#6b49f5}
.fbtn:disabled{background:#cdd0d8;cursor:default}
.metarow{cursor:default}
.chiptip{position:fixed;z-index:70;white-space:nowrap;
  background:#1a1813;color:#fbfbf9;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:11.5px;font-weight:500;line-height:1.5;letter-spacing:0;
  padding:6px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(26,24,19,.22);
  opacity:0;visibility:hidden;transform:translateY(-3px);
  transition:opacity .15s,visibility .15s,transform .15s;pointer-events:none}
.chiptip.on{opacity:1;visibility:visible;transform:translateY(0)}
.chiptip b{color:#c9b8ff;font-weight:700}
.mcount{display:flex;align-items:baseline;gap:6px}
.mhint{position:relative;cursor:help}
.mhinttip{position:absolute;top:calc(100% + 8px);left:-6px;width:240px;white-space:normal;
  background:#1a1813;color:#fbfbf9;font-size:11.5px;font-weight:500;line-height:1.5;letter-spacing:0;
  text-transform:none;padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(26,24,19,.22);
  opacity:0;visibility:hidden;transform:translateY(-3px);
  transition:opacity .15s,visibility .15s,transform .15s;pointer-events:none;z-index:70}
.mhint:hover .mhinttip{opacity:1;visibility:visible;transform:translateY(0)}
.mhinttip b{color:#c9b8ff;font-weight:700}
.fstat{font-size:11px;font-weight:600;color:#6b7280;line-height:1;min-width:4px;max-width:250px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fstat.err{color:#ef5350}
.fstat.ok{color:#00a37a}

/* calendar popover — range model borrowed from the plan-date picker */
.fcal{position:absolute;top:calc(100% + 7px);left:0;z-index:60;width:286px;background:#fff;
  border:1px solid #e4e6ec;border-radius:12px;padding:12px;
  box-shadow:0 12px 34px rgba(19,23,34,.13),0 2px 6px rgba(19,23,34,.06)}
.fcalhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.fcalmo{font-size:12px;font-weight:650;color:#131722;letter-spacing:-.1px}
.fcalnav{display:flex;gap:2px}
.fcalnav button{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:none;
  background:transparent;border-radius:6px;cursor:pointer;color:#787b86;font-size:13px;line-height:1;transition:background .13s}
.fcalnav button:hover{background:#f2f3f6;color:#131722}
.fcaldow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:3px}
.fcaldow span{font-size:9px;font-weight:700;color:#b2b5be;text-align:center;letter-spacing:.4px}
.fcalgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.fday{position:relative;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:550;color:#131722;background:transparent;border:none;cursor:pointer;
  border-radius:7px;transition:background .12s,color .12s}
.fday:hover:not(.dis){background:#f2f3f6}
.fday.dis{color:#d4d7de;cursor:default}
.fday.oth{color:#c9ccd6}
.fday.inr{background:#f1ecff;border-radius:0}
.fday.inr:hover{background:#e7dfff}
.fday.pre{background:#f7f4ff;border-radius:0}
.fday.end1,.fday.end2{background:#7c5cff;color:#fff;font-weight:700}
.fday.end1{border-radius:7px 0 0 7px}
.fday.end2{border-radius:0 7px 7px 0}
.fday.solo{background:#7c5cff;color:#fff;font-weight:700;border-radius:7px}
.fday.precap{background:#a98ffa;color:#fff;border-radius:0 7px 7px 0}
.fday.today::after{content:'';position:absolute;bottom:4px;width:3px;height:3px;border-radius:50%;background:#7c5cff}
.fday.end1.today::after,.fday.end2.today::after,.fday.solo.today::after{background:#fff}
.ftimes{display:flex;gap:6px;margin-top:10px}
.ftime{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:1px;background:#f6f7f9;
  border:1px solid #e8eaef;border-radius:8px;padding:4px 8px;transition:opacity .13s,border-color .13s}
.ftime.off{opacity:.6;background:#f1f2f5}
.ftime:focus-within{background:#fff;border-color:#7c5cff}
.ftlab{font-size:8.5px;font-weight:700;color:#a3a8b3;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.ftin{width:100%;min-width:0;font-family:inherit;font-size:11px;font-weight:650;color:#131722;
  background:transparent;border:none;outline:none;padding:0;font-variant-numeric:tabular-nums}
.ftin::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
.fcalhint{font-size:10.5px;font-weight:600;color:#9aa0ab;padding:7px 4px 2px;text-align:center}
.fcalhint b{color:#7c5cff;font-weight:750}
.fcalsep{height:1px;background:#eceef2;margin:11px -12px 10px}
.flivrow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:1px solid #e4e6ec;
  background:#fff;border-radius:9px;cursor:pointer;text-align:left;transition:background .13s,border-color .13s}
.flivrow:hover{background:#f6f7f9}
.flivrow.on{background:#e9f7f4;border-color:#9fd8ce}
.flivttl{display:block;font-size:11.5px;font-weight:650;color:#131722;line-height:1.25}
.flivsub{display:block;font-size:9.5px;font-weight:550;color:#9aa0ab;line-height:1.25}
.flivchk{margin-left:auto;font-size:11px;color:#1d8577;font-weight:700}
.fpre{display:flex;gap:5px;margin-top:9px}
.fpre button{flex:1;font-family:inherit;font-size:10px;font-weight:650;color:#787b86;background:#f6f7f9;
  border:none;border-radius:6px;padding:5px 0;cursor:pointer;transition:background .13s,color .13s}
.fpre button:hover{background:#ede8ff;color:#7c5cff}
.fcalft{margin-top:10px;font-size:10px;font-weight:600;color:#9aa0ab;text-align:center}
.fitbtn{position:absolute;top:9px;right:84px;z-index:6;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:10px;font-weight:600;color:#787b86;background:#f2f3f6;border:none;padding:3px 9px;border-radius:100px;cursor:pointer;transition:background .14s,color .14s}
.fitbtn.on{background:#ede8ff;color:#7c5cff}
.fpct{font-size:10px;font-weight:650;color:#7c5cff;background:#ede8ff;padding:3px 8px;border-radius:100px;letter-spacing:.2px;align-self:center;font-variant-numeric:tabular-nums}
.fsel{display:none !important}
.fdd{position:relative;display:flex}
.fddbtn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fddbtn.open{background:#fff;box-shadow:inset 0 0 0 1.5px #7c5cff}
.fddcv{color:#9aa0ab;flex-shrink:0;transition:transform .16s ease}
.fddbtn.open .fddcv{transform:rotate(180deg);color:#7c5cff}
.fddmenu[hidden],.fcal[hidden]{display:none !important}
.fddmenu{position:fixed;z-index:60;
  background:#fff;border:1px solid #e8eaef;border-radius:11px;padding:5px;
  box-shadow:0 12px 30px rgba(19,23,34,.13),0 2px 6px rgba(19,23,34,.06);
  display:flex;flex-direction:column;gap:1px;transform-origin:top left;
  animation:ddin .15s cubic-bezier(.2,.9,.3,1)}
@keyframes ddin{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:none}}
.fddopt{display:flex;align-items:center;gap:8px;font:inherit;font-size:12px;font-weight:500;
  color:#131722;background:none;border:none;border-radius:7px;padding:7px 11px 7px 8px;
  cursor:pointer;text-align:left;white-space:nowrap;transition:background .1s}
.fddopt:hover{background:#f4f5f8}
.fddopt .fddck{width:13px;flex-shrink:0;color:#7c5cff;opacity:0}
.fddopt.sel{background:#f3efff;color:#7c5cff;font-weight:650}
.fddopt.sel .fddck{opacity:1}
.fspin{display:inline-block;width:11px;height:11px;border-radius:50%;
  border:1.6px solid rgba(124,92,255,.22);border-top-color:#7c5cff;
  animation:fspin .62s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes fspin{to{transform:rotate(360deg)}}
.fstat.busy{color:#6b7280}
#chartbox{flex:1;position:relative;min-height:0}
#needdates{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}
#needdates[hidden]{display:none}
.ndinner{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;max-width:330px;color:#b0aca2}
.ndttl{font:600 13.5px -apple-system,'Segoe UI',Roboto,sans-serif;color:#131722;letter-spacing:-.1px}
.ndsub{font:500 11.5px -apple-system,'Segoe UI',Roboto,sans-serif;color:#8b8f9a;line-height:1.55}
html[data-embed] .fitbtn{display:none}
html[data-embed] body{background:#fff}
html[data-embed] #root{height:100%}
canvas{display:block}
.kicker{display:flex;align-items:center;gap:7px}
.mainrow{display:flex;align-items:center;gap:10px;margin-top:1px;line-height:1}
.metarow{display:flex;align-items:baseline;gap:10px;margin-top:-4px;padding-left:40px}
.mdot{width:5px;height:5px;border-radius:50%;background:#00c48c;flex-shrink:0;position:relative;top:-1px;
  animation:mblink 1.6s ease-in-out infinite}
@keyframes mblink{0%,100%{opacity:1}50%{opacity:.25}}
.mdot.off{background:#c2c6d0;animation:none}
/* the ticker itself is the contract control */
button.symtxt{font:inherit;font-size:29px;font-weight:450;letter-spacing:-.6px;color:#131722;
  background:none;border:none;padding:0 2px;margin:0 -2px;border-radius:6px;cursor:pointer;
  line-height:1.05;transition:background .12s,box-shadow .12s}
button.symtxt:hover{background:#f4f5f8}
button.symtxt.open{background:#f3efff;box-shadow:inset 0 0 0 1.5px #7c5cff}
.conedit{font:inherit;font-size:29px;font-weight:450;letter-spacing:-.6px;color:#131722;
  background:#fff;border:none;border-radius:6px;padding:0 4px;margin:0 -4px;line-height:1.05;
  box-shadow:inset 0 0 0 1.5px #7c5cff;outline:none;width:210px}
/* timeframe chip trigger */
.tfbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:17px;font-weight:700;
  color:#f7931a;background:none;border:none;padding:2px 5px;border-radius:6px;cursor:pointer;
  transition:background .12s,box-shadow .12s}
.tfbtn:hover{background:#fff6ec}
.tfbtn.open{background:#fff6ec;box-shadow:inset 0 0 0 1.5px #f7931a}
/* venue trigger sits in the kicker */
.srcbtn{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:10px;font-weight:750;
  letter-spacing:.13em;text-transform:uppercase;color:#4b5563;background:none;border:none;
  padding:1px 4px;border-radius:4px;cursor:pointer;transition:background .12s,color .12s}
.srcbtn:hover{background:#f4f5f8;color:#131722}
.srcbtn.open{background:#f3efff;color:#7c5cff}

</style>
</head>
<body>
<div id="root">
  <div id="needdates" hidden>
    <div class="ndinner">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div class="ndttl">Set trade dates to load the chart</div>
      <div class="ndsub">This plan has no start date yet. Set one on the plan and the chart will load from there — leave the exit open and it follows live.</div>
    </div>
  </div>
  <div id="chartbox">
    <canvas id="cv"></canvas>
    <div id="legend">
      <div id="symrow">
        <div class="kicker">
          <span class="krule"></span>
          <select id="fSource" class="fsel">
            <option value="binance" selected>Binance</option>
            <option value="gate">Gate</option>
          </select>
          <span id="fSrcTxt" class="symex">perpetual</span>
        </div>
        <div class="mainrow">
          <span class="coin">₿</span>
          <button id="fConBtn" class="symtxt" type="button">BTCUSDT.P</button>
          <input id="fContract" class="conedit" value="BTC_USDT" spellcheck="false" hidden>
          <select id="fInterval" class="fsel">
            <option>15m</option><option>30m</option><option selected>1h</option>
            <option>4h</option><option>8h</option><option>1d</option>
          </select>
        </div>
        <div class="metarow">
          <div class="fwrap">
            <button id="fRange" class="frange">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <span id="fRangeTxt">—</span>
              <svg class="rgcv" width="9" height="6" viewBox="0 0 9 6" fill="none"><path d="M1 1l3.5 3.5L8 1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
            <div id="fCal" class="fcal" hidden></div>
          </div>
          <span class="mcount"><span class="mdot"></span><span class="mhint"><span id="fStatus" class="fstat"></span><span class="mhinttip" id="fStatTip"></span></span></span>
          <button id="fLoad" hidden></button>
        </div>
      </div>
    </div>
    <div id="lvlChips"></div>
    <button id="fitBtn" class="fitbtn">Fit plan</button>

  </div>

// one factor for every HTML overlay, tied to viewport width
function uiScale(){ return Math.max(0.68, Math.min(1, W/1460)); }
function scaleOverlays(){
  var s=uiScale();
  var lg=document.getElementById('legend');
  if(lg){ lg.style.transformOrigin='top left'; lg.style.transform='scale('+s+')'; }
  var fb=document.getElementById('fitBtn');
  if(fb){ fb.style.transformOrigin='top right'; fb.style.transform='scale('+s+')'; }
}

function resize() {
  var box = cv.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  W = Math.floor(box.width); H = Math.floor(box.height);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  VOL_H = Math.round(Math.min(150, Math.max(64, H*0.2)));
  scaleOverlays();
  draw();
}

// seconds until the in-progress bar closes; null when the series isn't current
function barCountdown(){
  if(!candles.length) return null;
  var step=GATE_STEP[CUR_INTERVAL]; if(!step) return null;
  var lastT=candles[candles.length-1].t;
  var nowS=Math.floor(Date.now()/1000);
  // a historical window has no live bar — don't invent a countdown
  if(nowS - lastT > step*2) return null;
  var rem=(lastT+step)-nowS;
  return rem>0?rem:0;
}
function fmtCountdown(s){
  var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=Math.floor(s%60);
  return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');
}
var ARMED_AT = 120;   // bar the plan went live (real app: triggeredAt)
// First touch after arming: limit buys fill on a low, targets on a high.
function execBars(){
  var res={fills:{},levels:{}}, lastFill=ARMED_AT;
  var sh = POS.dir==='short';
  FILLS.forEach(function(f){
    if(!f.filled) return;
    for(var i=ARMED_AT;i<n;i++){
      var c=candles[i];
      // short sells into strength (fills on a high); long buys dips (on a low)
      if(sh ? c.h>=f.p : c.l<=f.p){ res.fills[f.n]=i; if(i>lastFill) lastFill=i; break; }
    }
  });
  LEVELS.forEach(function(lv){
    if(lv.id==='entry'||!lv.on||lv.p==null) return;
    var isTp=lv.id.slice(0,2)==='tp';
    // targets sit opposite the risk level, so each side tests a different extreme
    var wantLow = sh ? isTp : !isTp;
    for(var i=lastFill;i<n;i++){
      var c=candles[i];
      if(wantLow ? c.l<=lv.p : c.h>=lv.p){ res.levels[lv.id]=i; break; }
    }
  });
  // the position closes on whichever comes first — the stop, or the last target
  var sb=res.levels['liq'];
  var tps=Object.keys(res.levels).filter(function(k){ return k!=='liq'; });
  if(sb!=null){
    // targets after the stop never happen
    tps.forEach(function(k){ if(res.levels[k]>sb) delete res.levels[k]; });
    // if every target banked before the stop, we were already flat
    var live=Object.keys(res.levels).filter(function(k){ return k!=='liq'; });
    var allTp=LEVELS.filter(function(l){ return l.id.slice(0,2)==='tp' && l.on; }).length;
    if(live.length===allTp && allTp>0) delete res.levels['liq'];
  }
  return res;
}
// Weighted average of the TICKED fills only, renormalised over what's filled.
function fillState(){
  var w=0, s=0;
  FILLS.forEach(function(f){ if(f.filled){ w+=f.pct; s+=f.p*f.pct; } });
  return { pct:w, avg:w>0?s/w:null, qty:POS.qty*w/100 };
}
function fmtQty(q){ return q>=1 ? q.toFixed(2) : (Math.round(q*1000)/1000).toString(); }
var isDragging = false, dragStartX = 0, dragStartOffset = 0;
var isYDragging = false, yDragStartY = 0, yDragMid = 0, yDragHalfR = 0;
var isPinching = false, pinchStartDist = 0, pinchStartViewN = 0;

function clamp(v,a,b){return v<a?a:v>b?b:v;}
// the header is an HTML overlay: measure it so canvas guides can dodge it
var HEADER_BOX=null;     // union box, kept for reference
var OVERLAY_BOXES=[];    // every HTML overlay a canvas guide must avoid
function measureHeader(){
  HEADER_BOX=null; OVERLAY_BOXES=[];
  var cvr=cv.getBoundingClientRect();
  ['legend','lvlChips','fitBtn'].forEach(function(id){
    var el=document.getElementById(id);
    if(!el || el.hidden) return;
    var r=el.getBoundingClientRect();
    if(!r.width || !r.height) return;
    if(getComputedStyle(el).visibility==='hidden') return;
    OVERLAY_BOXES.push({ id:id, x0:r.left-cvr.left, x1:r.right-cvr.left,
                         y0:r.top-cvr.top,  y1:r.bottom-cvr.top });
  });
  if(OVERLAY_BOXES.length){
    var right=0, top=Infinity, bot=-Infinity;
    OVERLAY_BOXES.forEach(function(o){ right=Math.max(right,o.x1); top=Math.min(top,o.y0); bot=Math.max(bot,o.y1); });
    HEADER_BOX={ right:right, y0:top, y1:bot };
  }
}
// left edge a horizontal guide at row y may start from: clear of every overlay it hits
function guideStartX(y){
  var x=PAD_L;
  for(var i=0;i<OVERLAY_BOXES.length;i++){
    var o=OVERLAY_BOXES[i];
    if(y>=o.y0-2 && y<=o.y1+2 && o.x1+10>x) x=o.x1+10;
  }
  return x;
}
// top edge a vertical guide at column x may start from
function guideStartY(x){
  var y=PAD_T;
  for(var i=0;i<OVERLAY_BOXES.length;i++){
    var o=OVERLAY_BOXES[i];
    if(x>=o.x0-2 && x<=o.x1+2 && o.y1+8>y) y=o.y1+8;
  }
  return y;
}
// ── Guide primitives: overlay avoidance is theirs, not the caller's ──────────
function hGuide(y, xEnd){
  var yy=Math.round(y)+0.5, x0=guideStartX(yy);
  if(x0>=xEnd) return;
  ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(xEnd,yy); ctx.stroke();
}
function vGuide(x, yEnd){
  var xx=Math.round(x)+0.5, y0=guideStartY(xx);
  if(y0>=yEnd) return;
  ctx.beginPath(); ctx.moveTo(xx,y0); ctx.lineTo(xx,yEnd); ctx.stroke();
}
// every axis pill goes through this, so its band is always registered
function axisBox(y0,y1){ AXIS_BANDS.push({y0:y0,y1:y1}); }
// empty slots kept to the right of the newest bar, small on short series
function rightMargin(len){ return Math.min(8, Math.max(1, Math.round(len*0.06))); }
// TV lets you scroll past the newest candle into empty space.
function maxOffset(){ return n - viewN * 0.2; }

// ── Scale helpers ─────────────────────────────────────────────────────────────
function getScale() {
  var i0 = clamp(Math.floor(offset), 0, n-1);
  var i1 = clamp(Math.floor(offset + viewN), 0, n);
  var vis = candles.slice(i0, i1);
  if (!vis.length) return null;
  var cmn = Infinity, cmx = -Infinity;
  vis.forEach(function(c){ if(c.l<cmn)cmn=c.l; if(c.h>cmx)cmx=c.h; });
  var cr = cmx - cmn || 1;
  if (yManualRange) { cmn=yManualRange.lo; cmx=yManualRange.hi; cr=cmx-cmn||1; }
  else if (fitPlan) {
    var ps=[]; 
    LEVELS.forEach(function(l){ if(l.on&&l.p!=null) ps.push(l.p); });
    var fa=fillState().avg; if(fa!=null) ps.push(fa);
    FILLS.forEach(function(f){ if(f.filled) ps.push(f.p); });
    ps.forEach(function(p){ if(p<cmn)cmn=p; if(p>cmx)cmx=p; });
    cr = cmx-cmn||1; cmn -= cr*0.04; cmx += cr*0.04;
  }
  else { cmn -= cr*0.03; cmx += cr*0.08; }
  var cH = H - PAD_T - PAD_B - VOL_H;
  return { lo:cmn, hi:cmx, cH:cH,
    y: function(p){ return PAD_T + (1-(p-cmn)/(cmx-cmn))*cH; },
    inV: function(p){ return p>=cmn&&p<=cmx; } };
}

function slotW() { return (W-PAD_L-PAD_R)/viewN; }

// Flow layout: proportional widths, CONSTANT gap. Neighbours shift over.
function buildLayout(vis, maxV, i0) {
  var availW = W - PAD_L - PAD_R;
  var raws = vis.map(function(c){
    var vr = maxV > 0 ? c.v / maxV : 0.5;
    return 0.31 + 1.4 * vr;   // relative width units
  });
  var sumRaw = 0; raws.forEach(function(r){ sumRaw += r; });
  var avgRaw = raws.length ? sumRaw / raws.length : 1;
  var totalGap = GAP * Math.max(0, viewN - 1);
  var scale = avgRaw > 0 ? (availW - totalGap) / (avgRaw * viewN) : 1;
  // sub-pixel pan offset from the fractional part of `offset`
  var frac = offset - i0;
  var shift = -frac * (availW / viewN);
  var xs = [], ws = [], cur = PAD_L + shift;
  for (var i = 0; i < vis.length; i++) {
    var w = Math.max(1, raws[i] * scale);
    ws.push(w);
    xs.push(cur + w / 2);
    cur += w + GAP;
  }
  return { i0: i0, xs: xs, ws: ws };
}
function cx(i) {
  if (!LAYOUT) return PAD_L;
  var k = i - LAYOUT.i0;
  if (k >= 0 && k < LAYOUT.xs.length) return LAYOUT.xs[k];
  // extrapolate outside the visible range
  var availW = W - PAD_L - PAD_R;
  return PAD_L + (i - offset + 0.5) * (availW / viewN);
}
function cwAt(i) {
  if (!LAYOUT) return 4;
  var k = i - LAYOUT.i0;
  if (k >= 0 && k < LAYOUT.ws.length) return LAYOUT.ws[k];
  return (W - PAD_L - PAD_R) / viewN * 0.7;
}

// ── Format helpers ────────────────────────────────────────────────────────────
function fmt(p){ return p.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function isRound(p){ return Math.abs(p % 1000) < 0.01; }
function fmtShort(p){ return p>=1000?(p/1000).toFixed(1)+'k':p.toFixed(0); }
function fmtVol(v){ return v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v.toFixed(0); }
function fmtDate(t){
  var d=new Date(t*1000);
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var yy=String(d.getFullYear()).slice(-2);
  var hh=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return DOW[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]+" '"+yy+'   '+hh+':'+mi;
}
function fmtDateShort(t){ var d=new Date(t*1000); return (d.getMonth()+1)+'/'+(d.getDate()); }

function sidePill(c,x,y,w,h,rl,rr){
  c.beginPath(); c.moveTo(x+rl,y); c.lineTo(x+w-rr,y);
  if(rr) c.arcTo(x+w,y,x+w,y+rr,rr); else c.lineTo(x+w,y);
  c.lineTo(x+w,y+h-rr);
  if(rr) c.arcTo(x+w,y+h,x+w-rr,y+h,rr); else c.lineTo(x+w,y+h);
  c.lineTo(x+rl,y+h);
  if(rl) c.arcTo(x,y+h,x,y+h-rl,rl); else c.lineTo(x,y+h);
  c.lineTo(x,y+rl);
  if(rl) c.arcTo(x,y,x+rl,y,rl); else c.lineTo(x,y);
  c.closePath();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y);
  c.arcTo(x+w,y,x+w,y+r,r); c.lineTo(x+w,y+h-r);
  c.arcTo(x+w,y+h,x+w-r,y+h,r); c.lineTo(x+r,y+h);
  c.arcTo(x,y+h,x,y+h-r,r); c.lineTo(x,y+r);
  c.arcTo(x,y,x+r,y,r); c.closePath();
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  if (!W||!H) return;
  ctx.clearRect(0,0,W,H);

  var sc = getScale();
  if (!sc) return;
  (function(){ var fb=document.getElementById('fitBtn'); if(fb) fb.style.right=(PAD_R+12)+'px'; })();
measureHeader();
  var cW = slotW();
  // body width: min 40% slot, max 85% slot — proportion of volume
  var maxV = 0;
  var i0 = clamp(Math.floor(offset),0,n-1);
  var i1 = clamp(Math.ceil(offset+viewN),0,n);
  var vis = candles.slice(i0,i1);
  vis.forEach(function(c){ if(c.v>maxV)maxV=c.v; });
  LAYOUT = buildLayout(vis, maxV, i0);

  // ── Chart bg
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

  // ── Time axis bg
  ctx.strokeStyle=C.grid; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H-PAD_B+0.5); ctx.lineTo(W,H-PAD_B+0.5); ctx.stroke();

  // pre-compute occupied axis rows so the grid labels can avoid them
  AXIS_SKIP = [];
  AXIS_BANDS = [];
  (function(){
    var lastC=candles[n-1];
    if(lastC && sc.inV(lastC.c)){
      var ly=sc.y(lastC.c), tall=(barCountdown()!=null);
      axisBox(ly-9, ly+(tall?21:9));                   // matches the drawn box
    }
    // the crosshair pill occupies its row too, whenever it is showing
    if(crosshairX>=PAD_L && crosshairX<=W-PAD_R && crosshairY>=PAD_T && crosshairY<=H-PAD_B){
      axisBox(crosshairY-9, crosshairY+9);
    }
  })();
  (function(){
    var hi=-Infinity, lo=Infinity;
    vis.forEach(function(c){ if(c.h>hi)hi=c.h; if(c.l<lo)lo=c.l; });
    [hi,lo].forEach(function(pv){ if(sc.inV(pv)) AXIS_SKIP.push(Math.round(sc.y(pv))+0.5); });
  })();

  // pre-register level axis pill rows so the grid never prints under them
  (function(){
    var av=null, wsum=0, psum=0;
    FILLS.forEach(function(f){ if(f.filled && isFinite(f.p)){ psum+=f.p*f.pct; wsum+=f.pct; } });
    if(wsum>0) av=psum/wsum;
    LEVELS.forEach(function(lv){
      var p = (lv.id==='entry') ? av : lv.p;
      if(lv.id!=='entry' && !lv.on) return;
      if(p==null || !isFinite(p) || !sc.inV(p)) return;
      var ly=Math.round(sc.y(p))+0.5;
      AXIS_BANDS.push({ y0:ly-9, y1:ly+9 });
    });
  })();

  // ── Price grid
  var priceRange = sc.hi-sc.lo;
  var rawStep = priceRange/14;
  var mag = Math.pow(10,Math.floor(Math.log10(rawStep)));
  var steps = [1,2,2.5,5,10];
  var priceStep = mag;
  for(var si=0;si<steps.length;si++){ var s=steps[si]*mag; if(s>=rawStep){priceStep=s;break;} }
  var p0=Math.ceil(sc.lo/priceStep)*priceStep;
  ctx.font='10px JetBrains Mono'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(var p=p0;p<=sc.hi;p+=priceStep){
    var gy=Math.round(sc.y(p))+0.5;
    if(gy<PAD_T||gy>H-PAD_B-VOL_H)continue;
    var clash=false;
    for(var ai=0;ai<AXIS_SKIP.length;ai++){ if(Math.abs(AXIS_SKIP[ai]-gy)<11){ clash=true; break; } }
    for(var bi2=0;bi2<AXIS_BANDS.length && !clash;bi2++){
      var bd=AXIS_BANDS[bi2];
      if(gy+7 > bd.y0 && gy-7 < bd.y1) clash=true;   // label box overlaps the band
    }
    if(clash) continue;
    ctx.font=(isRound(p)?'bold ':'')+'11px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle=isRound(p)?'#131722':C.axisText; ctx.textAlign='right'; ctx.fillText(fmt(p),W-8,gy);
    ctx.font='10px JetBrains Mono';
  }
  ctx.setLineDash([]);
  // price axis divider
  ctx.strokeStyle=C.grid; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W-PAD_R+0.5,0); ctx.lineTo(W-PAD_R+0.5,H-PAD_B); ctx.stroke();

  // ── Time labels
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // candidates = the first visible bar of each calendar day (a day can never repeat)
  var cands=[];
  vis.forEach(function(c,i){
    var gi=i0+i, tx=cx(gi);
    if(tx<PAD_L+14||tx>W-PAD_R-14) return;
    var d=new Date(c.t*1000);
    var prev=(i>0)?new Date(vis[i-1].t*1000):null;
    if(prev && prev.getDate()===d.getDate() && prev.getMonth()===d.getMonth()) return;
    cands.push({ tx:tx, d:d, newMonth:!!prev && prev.getMonth()!==d.getMonth() });
  });

  if(cands.length>=2){
    // thin to fit, but never drop a month marker
    var slots=Math.max(1,Math.floor((W-PAD_L-PAD_R)/64));
    var every=Math.max(1,Math.ceil(cands.length/slots));
    var lastX=-999;
    cands.forEach(function(k,ci){
      if(!k.newMonth && ci%every!==0) return;
      if(k.tx-lastX<34) return;
      lastX=k.tx;
      ctx.font=(k.newMonth?'bold ':'')+'11px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillStyle=k.newMonth?'#131722':C.axisText;
      ctx.fillText(k.newMonth?MON[k.d.getMonth()]:String(k.d.getDate()),k.tx,H-PAD_B+13);
    });
  } else {
    // zoomed inside a single day: label times instead of leaving the axis blank
    var tLast=-999;
    vis.forEach(function(c,i){
      var tx=cx(i0+i);
      if(tx<PAD_L+18||tx>W-PAD_R-18) return;
      if(tx-tLast<58) return;
      var d=new Date(c.t*1000);
      var dayStart=(d.getHours()===0&&d.getMinutes()===0);
      tLast=tx;
      ctx.font=(dayStart?'bold ':'')+'11px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillStyle=dayStart?'#131722':C.axisText;
      ctx.fillText(dayStart?String(d.getDate()):String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),tx,H-PAD_B+13);
    });
  }

  // ── Volume pane bg + divider
  var volTop=H-PAD_B-VOL_H, volBot=H-PAD_B;
  ctx.strokeStyle=C.grid; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PAD_L,volTop+0.5); ctx.lineTo(W-PAD_R,volTop+0.5); ctx.stroke();


  // ── Series clip: candles + volume can never paint over the price axis
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAD_L, 0, (W-PAD_R)-PAD_L, H-PAD_B);
  ctx.clip();

  // ── Volume bars (height proportional, width proportional like TV)
  if(maxV>0){
    vis.forEach(function(c,i){
      var x=cx(i0+i);
      if(x<PAD_L-cW||x>W-PAD_R+cW)return;
      var bull=c.c>=c.o;
      var vr=c.v/maxV;
      var bw=cwAt(i0+i);
      var bh=Math.max(1,Math.round(vr*(VOL_H-6)));
      ctx.globalAlpha=1;
      ctx.fillStyle=bull?C.volBull:C.volBear;
      ctx.fillRect(Math.round(x-bw/2),volBot-bh,bw,bh);
    });
    ctx.globalAlpha=1;
    // Volume MA line
    ctx.save();
    ctx.strokeStyle=C.priceBox; ctx.lineWidth=1.2; ctx.setLineDash([4,3]); ctx.globalAlpha=0.9;
    ctx.beginPath();
    var started=false;
    vis.forEach(function(c,i){
      if(!c.vma||isNaN(c.vma))return;
      var vr=c.vma/maxV;
      var my=volBot-Math.round(vr*(VOL_H-6));
      var mx=cx(i0+i);
      if(!started){ctx.moveTo(mx,my);started=true;}else ctx.lineTo(mx,my);
    });
    ctx.stroke(); ctx.restore();
  }

  // ── Candles (volume-proportional body width)
  vis.forEach(function(c,i){
    var x=cx(i0+i);
    if(x<PAD_L-cW||x>W-PAD_R+cW)return;
    var bull=c.c>=c.o;
    var col=bull?C.bull:C.bear;
    var yH=sc.y(c.h),yL=sc.y(c.l);
    var yO=sc.y(c.o),yC=sc.y(c.c);
    var top=Math.min(yO,yC),bh=Math.max(1,Math.max(yO,yC)-top);
    var bw=cwAt(i0+i);
    // wick
    ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5,yH); ctx.lineTo(Math.round(x)+0.5,yL); ctx.stroke();
    // body
    ctx.fillStyle=col;
    ctx.fillRect(Math.round(x-bw/2),top,bw,bh);
  });
  ctx.restore();   // end series clip

  // ── Position marks (TradingView-style) ──────────────────────────────────────
  LEVEL_HITS = []; FILL_HITS = []; PLOT_TAGS = []; OOR_HITS = []; EXEC_HITS = [];
  (function(){
    var fs = fillState();
    var entryLv = LEVELS.filter(function(l){ return l.id==='entry'; })[0];
    // the entry line IS the running weighted average of filled rungs
    if(entryLv) entryLv.p = fs.avg;
    var showEntry = !!(entryLv && entryLv.on && fs.avg!==null);
    var riskLv  = LEVELS.filter(function(l){ return l.id==='liq' && l.on; })[0];
    var tpLvs   = LEVELS.filter(function(l){ return l.id.slice(0,2)==='tp' && l.on; });
    var xL = PAD_L, xR = W-PAD_R;
    var plotTop = PAD_T, plotBot = H-PAD_B-VOL_H;
    function clampY(v){ return Math.max(plotTop, Math.min(plotBot, v)); }
    var fillTop = 0;                                  // tint reaches the very top
    function clampFill(v){ return Math.max(fillTop, Math.min(plotBot, v)); }

    // ── zones, anchored on the average entry
    if(showEntry){
      var eY = clampFill(sc.y(fs.avg));
      // a zone whose BOTH edges are off-screen would tint the whole plot with
      // nothing on screen to explain it — skip those.
      if(tpLvs.length){
        var tp = tpLvs.map(function(t){ return t.p; });
        var tPrice = POS.dir==='short' ? Math.min.apply(null,tp) : Math.max.apply(null,tp);
        if(sc.inV(fs.avg) || sc.inV(tPrice)){
          var tY = clampFill(sc.y(tPrice));
          ctx.fillStyle='rgba(38,166,154,0.055)';
          ctx.fillRect(xL,Math.min(eY,tY),xR-xL,Math.abs(tY-eY));
        }
      }
      if(riskLv && (sc.inV(fs.avg) || sc.inV(riskLv.p))){
        var rY = clampFill(sc.y(riskLv.p));
        ctx.fillStyle='rgba(239,83,80,0.055)';
        ctx.fillRect(xL,Math.min(eY,rY),xR-xL,Math.abs(rY-eY));
      }
    }

    // fill wedge: ring outline + clockwise sweep from 12 o'clock (matches the chip icon)
  function fillPie(c, cx0, cy0, r, pct){
    var f=Math.max(0,Math.min(100,pct))/100;
    c.save();
    c.strokeStyle='#fff'; c.lineWidth=1.1; c.globalAlpha=0.85;
    c.beginPath(); c.arc(cx0,cy0,r,0,Math.PI*2); c.stroke();
    if(f>0){
      c.globalAlpha=1; c.fillStyle='#fff';
      c.beginPath();
      if(f>=1){ c.arc(cx0,cy0,r,0,Math.PI*2); }
      else { c.moveTo(cx0,cy0); c.arc(cx0,cy0,r,-Math.PI/2,-Math.PI/2+Math.PI*2*f); c.closePath(); }
      c.fill();
    }
    c.restore();
  }

  // ── money label per level, measured off the average entry & filled size
    function tagFor(lv){
      if(lv.id==='entry'){
        return (POS.dir==='long'?'▲ LONG':'▼ SHORT');
      }
      if(fs.avg===null) return lv.short;
      var share = (lv.bank!=null? lv.bank/100 : 1);
      var d = (lv.p-fs.avg)*fs.qty*share*(POS.dir==='long'?1:-1);
      return lv.short+'  '+(d>=0?'+':'−')+'$'+Math.abs(Math.round(d)).toLocaleString('en-US');
    }

    // Execution glyphs paint BEFORE the level tags: a glyph sits at its level's own
    // price row by definition, so painting it after would always garble that tag.
    var EX = execBars();
    EXEC_DOTS = [];
    (function(){
      function dot(bi, price, col){
        if(bi==null) return;
        var dx=cx(bi), dy=sc.y(price);
        if(dx<xL-30||dx>xR+30||dy<plotTop-30||dy>plotBot+30) return;
        ctx.save();
        ctx.translate(Math.round(dx)+0.5,Math.round(dy)+0.5);
        ctx.rotate(Math.PI/4);
        ctx.fillStyle=col; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.rect(-3.6,-3.6,7.2,7.2); ctx.fill(); ctx.stroke();
        ctx.restore();
        EXEC_DOTS.push({ x0:dx-5.9, x1:dx+5.9, y0:dy-5.9, y1:dy+5.9 });
      }
      FILLS.forEach(function(f){ if(f.filled) dot(EX.fills[f.n], f.p, ENTRY_COL); });
      LEVELS.forEach(function(lv){
        if(lv.id==='entry'||!lv.on||lv.p==null) return;
        dot(EX.levels[lv.id], lv.p, lv.col);
      });
    })();

    var oorQueue = [], oorUp = 0, oorDn = 0;
    // clear any HTML overlay sharing the chips' column (e.g. the Fit plan button)
    var oorTop = plotTop+10;
    OVERLAY_BOXES.forEach(function(o){
      if(o.x1 > W-PAD_R-130 && o.y1+12 > oorTop) oorTop = o.y1+12;
    });
    var act = LEVELS.filter(function(l){
      if(l.id==='entry') return showEntry;
      return l.on && l.p!=null;
    });

    act.forEach(function(lv){
      if(!sc.inV(lv.p)){
        oorQueue.push({ lv:lv, above:lv.p>sc.hi });   // row chosen after in-plot tags exist
        return;
      }
      var y = Math.round(sc.y(lv.p))+0.5;
      var isEntry = lv.id==='entry';

      ctx.save();
      ctx.strokeStyle=lv.col; ctx.lineWidth=isEntry?1.4:1;
      ctx.globalAlpha=isEntry?0.6:0.28;
      ctx.setLineDash(isEntry?[]:[5,4]);
      ctx.beginPath(); ctx.moveTo(guideStartX(y),y); ctx.lineTo(xR,y); ctx.stroke();
      ctx.restore();

      var txt = tagFor(lv);
      ctx.save();
      ctx.font=(isEntry?'700 ':'600 ')+'10px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.textBaseline='middle'; ctx.textAlign='left';
      var tw = ctx.measureText(txt).width;
      var tagW = tw+16, tagX = xR-tagW;
      ctx.fillStyle=lv.col;
      sidePill(ctx,tagX,y-9,tagW,18,5,0); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillText(txt,tagX+8,y);
      ctx.restore();
      PLOT_TAGS.push({ id:lv.id, x0:tagX, x1:xR, y0:y-9, y1:y+9 });

      ctx.save(); ctx.font='600 10.5px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillStyle=lv.col;
      sidePill(ctx,xR,y-9,PAD_R-6,18,0,5); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textBaseline='middle';
      ctx.textAlign='right'; ctx.fillText(fmt(lv.p),W-9,y); ctx.restore();
      LEVEL_HITS.push({ id:lv.id, x0:W-PAD_R+1, y0:y-7, x1:W, y1:y+7 });
    });

    // ── off-screen level markers: nearest free row, never over an in-plot tag
    function rowBusy(x0,x1,yc){
      var y0=yc-8, y1=yc+8;
      function hit(r){ return !(x1<=r.x0 || x0>=r.x1 || y1<=r.y0 || y0>=r.y1); }
      for(var i=0;i<PLOT_TAGS.length;i++) if(hit(PLOT_TAGS[i])) return true;
      for(var j=0;j<OOR_HITS.length;j++) if(OOR_HITS[j].x1>0 && hit(OOR_HITS[j])) return true;
      return false;
    }
    oorQueue.forEach(function(q){
      ctx.save(); ctx.font='600 9.5px -apple-system,Segoe UI,Roboto,sans-serif';
      var mtxt=(q.above?'↑ ':'↓ ')+q.lv.short+'  '+fmt(q.lv.p);
      var mw=ctx.measureText(mtxt).width; ctx.restore();
      var cw0=mw+13, cx0=xR-cw0-4;
      var slotN = q.above ? oorUp++ : oorDn++;
      var ay = q.above ? oorTop+slotN*17 : plotBot-10-slotN*17;
      var step = q.above ? 17 : -17, guard=0;
      while(guard++<40 && rowBusy(cx0,cx0+cw0,ay)) ay += step;
      q.ay = ay;
      OOR_HITS.push({ y:ay, y0:ay-8, y1:ay+8, x0:cx0, x1:cx0+cw0 });
    });
    oorQueue.forEach(function(q){
      var lv=q.lv, txt=(q.above?'↑ ':'↓ ')+lv.short+'  '+fmt(lv.p);

      ctx.textAlign='left'; ctx.textBaseline='middle';
      var tw=ctx.measureText(txt).width, cw=tw+13, cxx=xR-cw-4;
      ctx.globalAlpha=0.95; ctx.fillStyle='#fff';

      ctx.globalAlpha=0.9; ctx.fillStyle=lv.col;
      roundRect(ctx,cxx,q.ay-8,cw,16,4); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle='#fff';
      ctx.fillText(txt,cxx+7,q.ay);
      ctx.restore();
    });

    // ── execution markers
    var slots = {};
    function execMarker(bi, price, col, label, above){
      if(bi==null) return;
      var x = cx(bi);
      if(x < PAD_L-30 || x > xR+30) return;
      var py = sc.y(price);
      if(py < plotTop-30 || py > plotBot+30) return;
      var c = candles[bi];
      var bh = 15;

      // measure first, so placement can test the real rect
      ctx.save();
      ctx.font='700 9px -apple-system,Segoe UI,Roboto,sans-serif';
      var bwM = ctx.measureText(label).width+12;
      ctx.restore();

      if(!slots.rects) slots.rects = [];
      function free(cy){
        var t=cy-bh/2, bt=cy+bh/2, l=x-bwM/2, r=x+bwM/2;
        // must stay inside the plot box — never stray into the header chrome
        if(t < plotTop+1 || bt > plotBot-1) return false;
        var i,j,o,list,claimed=[OOR_HITS, PLOT_TAGS, EXEC_DOTS, slots.rects];
        for(j=0;j<claimed.length;j++){
          list=claimed[j]||[];
          for(i=0;i<list.length;i++){
            o=list[i];

            if(!(r<o.x0||l>o.x1) && !(bt<o.y0||t>o.y1)) return false;
          }
        }
        return true;
      }

      // try the natural side first, then the other one
      var placed=null, sides = above ? [-1,1] : [1,-1];
      for(var sIdx=0; sIdx<sides.length && !placed; sIdx++){
        var cd=sides[sIdx];
        var base=clampY(cd===-1 ? sc.y(c.h) : sc.y(c.l));
        for(var kIdx=0; kIdx<10; kIdx++){
          var cy=base + cd*(14 + kIdx*(bh+3));
          if(free(cy)){ placed={y:cy,dir:cd,base:base,first:kIdx===0}; break; }
        }
      }
      if(!placed) return;
      var anchorY=placed.base, dir=placed.dir, bY=placed.y;
      slots.rects.push({ x0:x-bwM/2, x1:x+bwM/2, y0:bY-bh/2, y1:bY+bh/2 });
      EXEC_HITS.push({ x0:x-bwM/2, x1:x+bwM/2, y0:bY-bh/2, y1:bY+bh/2 });

      // stem from the badge down/up to the executed price
      ctx.save();
      ctx.strokeStyle=col; ctx.globalAlpha=0.4; ctx.lineWidth=1; ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5,py); ctx.lineTo(Math.round(x)+0.5,bY); ctx.stroke();
      ctx.restore();

      // badge + pointer
      ctx.save();
      ctx.font='700 9px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      var bw = bwM;
      ctx.fillStyle=col;
      roundRect(ctx,x-bw/2,bY-bh/2,bw,bh,4); ctx.fill();
      var edgeY = bY - dir*(bh/2);
      if(placed.first){
        ctx.beginPath();
        ctx.moveTo(x-3.5,edgeY); ctx.lineTo(x+3.5,edgeY);
        ctx.lineTo(x,anchorY+dir*3); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle='#fff'; ctx.fillText(label,x,bY);
      ctx.restore();

    }

    // a short sells into highs, so its entry pointers sit above the bar
    var shortPos = POS.dir==='short';
    FILLS.forEach(function(f){
      if(f.filled) execMarker(EX.fills[f.n], f.p, ENTRY_COL, 'Fill '+f.n+' · '+f.pct+'%', shortPos);
    });
    LEVELS.forEach(function(lv){
      if(lv.id==='entry'||!lv.on||lv.p==null) return;
      var isTp = lv.id.slice(0,2)==='tp';
      execMarker(EX.levels[lv.id], lv.p, lv.col, lv.short, shortPos ? !isTp : isTp);
    });

    ctx.setLineDash([]);
  })();

  // ── High / Low tags for the visible range
  var visHi=-Infinity, visLo=Infinity;
  vis.forEach(function(c){ if(c.h>visHi)visHi=c.h; if(c.l<visLo)visLo=c.l; });
  var HL_ROWS=[];
  [[visHi,'High'],[visLo,'Low']].forEach(function(pair){
    var pv=pair[0], tag=pair[1];
    if(!sc.inV(pv))return;
    var ty=Math.round(sc.y(pv))+0.5;
    // Two separate questions, because the obstacles live in different columns.
    var PILL_H=18, sameBand=function(y0,y1){ return !(ty+PILL_H/2 < y0 || ty-PILL_H/2 > y1); };

    // 1. the AXIS price pill: if its own row is occupied, step to the nearest
    //    free one rather than abandoning the marker.
    function axisRowFree(y){
      for(var ai=0;ai<LEVEL_HITS.length;ai++){
        var lh2=LEVEL_HITS[ai];
        if(lh2.x0 >= W-PAD_R-1 && !(y+PILL_H/2 < lh2.y0-2 || y-PILL_H/2 > lh2.y1+2)) return false;
      }
      for(var bi=0;bi<AXIS_BANDS.length;bi++){
        var bd=AXIS_BANDS[bi];
        if(!(y+PILL_H/2 < bd.y0 || y-PILL_H/2 > bd.y1)) return false;
      }
      for(var hi2=0;hi2<HL_ROWS.length;hi2++){
        if(Math.abs(HL_ROWS[hi2]-y) < PILL_H+1) return false;      // the other H/L pill
      }
      return y-PILL_H/2 >= 2 && y+PILL_H/2 <= H-PAD_B-2;
    }
    var py=ty;
    if(!axisRowFree(py)){
      var found=false;
      for(var d2=PILL_H+1; d2<=140 && !found; d2+=PILL_H+1){
        var down=ty+d2, up=ty-d2;
        var preferDown=(tag==='Low');
        var cands2=preferDown?[down,up]:[up,down];
        for(var ci2=0;ci2<cands2.length;ci2++){
          if(axisRowFree(cands2[ci2])){ py=cands2[ci2]; found=true; break; }
        }
      }
      if(!found) py=ty;   // nowhere better: draw on its own row regardless
    }
    HL_ROWS.push(py);

    // 2. the in-plot LABEL pill slides left past anything sharing its band
    var rightX = W-PAD_R;
    function avoid(x0,y0,y1){
      if(x0 >= W-PAD_R) return;            // in the axis column, not our problem
      if(!sameBand(y0,y1)) return;
      if(x0-6 < rightX) rightX = x0-6;
    }
    for(var oi2=0;oi2<OOR_HITS.length;oi2++){ var oh2=OOR_HITS[oi2]; if(oh2.x1>0) avoid(oh2.x0,oh2.y0-2,oh2.y1+2); }
    for(var ei2=0;ei2<EXEC_HITS.length;ei2++){ var eh2=EXEC_HITS[ei2]; avoid(eh2.x0,eh2.y0,eh2.y1); }
    for(var li2=0;li2<LEVEL_HITS.length;li2++){ var lh3=LEVEL_HITS[li2]; avoid(lh3.x0,lh3.y0,lh3.y1); }

    var hlCol0='#8b8f9a';
    ctx.save();
    ctx.font='600 10px -apple-system,Segoe UI,Roboto,sans-serif';
    var twPre=ctx.measureText(tag).width, tagW2=twPre+16, tagX2=(W-PAD_R)-tagW2;
    var labelFits=(rightX >= W-PAD_R);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle='#b2b5be'; ctx.lineWidth=1;
    ctx.globalAlpha=.28; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(guideStartX(ty),ty); ctx.lineTo((labelFits&&py===ty)?tagX2:(W-PAD_R),ty); ctx.stroke();
    ctx.restore();

    var hlCol='#8b8f9a';
    // label pill inside the plot (left-rounded), same geometry as the levels
    ctx.save();
    ctx.font='600 10px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textBaseline='middle'; ctx.textAlign='left';
    if(labelFits && py===ty){
      ctx.fillStyle=hlCol;
      sidePill(ctx,tagX2,py-9,tagW2,18,5,0); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillText(tag,tagX2+8,py);
    }
    ctx.restore();
    // price on the axis (right-rounded), on the resolved row
    ctx.save();
    ctx.font='600 10.5px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle=hlCol;
    sidePill(ctx,W-PAD_R,py-9,PAD_R-6,18,0,5); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textBaseline='middle';
    if(!labelFits || py!==ty){
      ctx.font='700 9.5px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.textAlign='left'; ctx.fillText(tag.charAt(0), W-PAD_R+6, py);
      ctx.font='600 10.5px -apple-system,Segoe UI,Roboto,sans-serif';
    }
    ctx.textAlign='right';
    ctx.fillText(fmt(pv),W-9,py);
    ctx.restore();
    AXIS_SKIP.push(py);
    AXIS_BANDS.push({y0:py-9,y1:py+9});
  });

  // ── Volume axis labels (Volume MA / Volume), TV places these in the axis
  var lastC=candles[Math.min(n-1,Math.max(0,Math.round(offset+viewN)-1))]||candles[n-1];
  if(maxV>0&&lastC){
    var vmaY=volBot-16, volY=volBot-2;
    ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textBaseline='middle';
    ctx.font='500 10px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle='#131722'; roundRect(ctx,W-PAD_R+3,vmaY-8,PAD_R-9,16,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='right';
    ctx.fillText(lastC.vma?fmtVol(lastC.vma):'—',W-9,vmaY);
    var vbull=lastC.c>=lastC.o;
    ctx.fillStyle=vbull?C.bull:C.bear; roundRect(ctx,W-PAD_R+3,volY-8,PAD_R-9,16,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText(fmtVol(lastC.v),W-9,volY);

  }

  // ── Live price label
  var last=candles[n-1];
  if(sc.inV(last.c)){
    var ly=sc.y(last.c);
    var bull2=last.c>=last.o;
    var cd=barCountdown();
    ctx.fillStyle=bull2?C.bull:C.bear;
    roundRect(ctx,W-PAD_R+3,ly-9,PAD_R-9,cd!=null?30:18,4); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='650 11.5px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(fmt(last.c),W-9,ly);
    if(cd!=null){
      ctx.font='500 10px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.globalAlpha=0.85;
      ctx.fillText(fmtCountdown(cd),W-9,ly+12);
      ctx.globalAlpha=1;
    }
    // dashed guide
    ctx.strokeStyle=bull2?C.bull:C.bear; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    hGuide(ly, W-PAD_R);
    ctx.setLineDash([]);
  }

  // ── Crosshair
  if(crosshairX>=PAD_L&&crosshairX<=W-PAD_R){
    ctx.strokeStyle=C.cross; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    vGuide(crosshairX, H-PAD_B);
    if(crosshairY>=PAD_T&&crosshairY<=H-PAD_B){
      var chY=Math.round(crosshairY)+0.5;
      hGuide(crosshairY, W-PAD_R);
      // price label on right axis
      var cp=(1-(crosshairY-PAD_T)/sc.cH)*(sc.hi-sc.lo)+sc.lo;
      ctx.setLineDash([]);
      ctx.fillStyle=C.priceBox;
      roundRect(ctx,W-PAD_R+3,crosshairY-9,PAD_R-9,18,4); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='500 11px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillText(fmt(cp),W-9,crosshairY);
    }
    ctx.setLineDash([]);
    // date label
    if(hoveredIdx>=0&&hoveredIdx<n){
      var dateLbl=fmtDate(candles[hoveredIdx].t);
      ctx.font='12px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign='center';
      var dlW=ctx.measureText(dateLbl).width+24;
      var hx=Math.round(cx(hoveredIdx));
      hx=Math.max(PAD_L+dlW/2,Math.min(W-PAD_R-dlW/2,hx));
      ctx.fillStyle=C.priceBox;
      roundRect(ctx,hx-dlW/2,H-PAD_B+2,dlW,21,4); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textBaseline='middle';
      ctx.fillText(dateLbl,hx,H-PAD_B+12);
    }

function posToIdx(px){
  if (!LAYOUT || !LAYOUT.xs.length) return Math.round(offset+(px-PAD_L)/slotW()-0.5);
  var best = 0, bestD = Infinity;
  for (var k = 0; k < LAYOUT.xs.length; k++) {
    var d = Math.abs(LAYOUT.xs[k] - px);
    if (d < bestD) { bestD = d; best = k; }
  }
  return LAYOUT.i0 + best;
}

    yManualRange=null;

  if(isYDragging){

    var sf=Math.max(0.1,Math.min(8,1+dy/(H-PAD_T-PAD_B)));
    yManualRange={lo:yDragMid-yDragHalfR*sf,hi:yDragMid+yDragHalfR*sf};

// nudge overlapping chips apart while their ticks stay at the true price
var RAIL_RO=null;
function scheduleSpread(rail){
  requestAnimationFrame(function(){ spreadChips(rail); });
  // fonts change chip widths after first paint
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ spreadChips(rail); });
  if(window.ResizeObserver && !RAIL_RO){
    RAIL_RO=new ResizeObserver(function(){
      var r=document.querySelector('.lvlrail');
      if(r) spreadChips(r);
    });
    RAIL_RO.observe(rail.parentElement);
  }
}
function spreadChips(rail){
  var row=rail.parentElement;
  if(!row) return;
  var rowW=row.clientWidth;
  if(!rowW){ requestAnimationFrame(function(){ spreadChips(rail); }); return; }

  var chips=[].slice.call(rail.querySelectorAll('.lchip'));
  var pxs =[].slice.call(rail.querySelectorAll('.lchip .lpx'));
  var sep =row.querySelector('.cdiv');
  var wrap=row.querySelector('.fmeterwrap');
  var meter=row.querySelector('.fmeter');
  var lbl =row.querySelector('.fmlbl');
  var GAP=6, ROWGAP=12;

  // start from the richest form, then strip back
  pxs.forEach(function(e){ e.style.display=''; });
  if(lbl) lbl.style.display='';
  if(meter) meter.style.display='';

  function chipsW(){
    var t=0; chips.forEach(function(c){ t+=c.getBoundingClientRect().width; });
    return t + GAP*Math.max(0,chips.length-1);
  }
  function tailW(){
    var t=0;
    if(sep)  t+=sep.getBoundingClientRect().width+ROWGAP;
    if(wrap) t+=wrap.getBoundingClientRect().width+ROWGAP;
    return t;
  }

  // stage 1: full — prices + meter
  var need=chipsW(), avail=rowW-tailW();
  // prices stay with their level at all times — shed the tail chrome instead; when the
  // row still cannot fit inline it flips to the centered capsule, which is max-content
  // stage 2: drop the "filled" word
  if(avail<need && lbl){ lbl.style.display='none'; avail=rowW-tailW(); }
  // stage 3: drop the meter bar, keep the percentage
  if(avail<need && meter){ meter.style.display='none'; avail=rowW-tailW(); }

  // rail mode only when there is genuine slack for positions to mean something
  rail.classList.remove('flat');
  if(row) row.classList.remove('capsule');
  // when embedded (the dashboard's plan chart) always use the compact capsule — the
  // spread-by-price rail is a wide-standalone look; the host wants the capsule in all cases
  if(document.documentElement.hasAttribute('data-embed') || avail < need+110){
    rail.classList.add('flat');
    if(row) row.classList.add('capsule');
    [].slice.call(rail.querySelectorAll('.railtick')).forEach(function(t){
      t.style.left=(parseFloat(t.dataset.pct)||0)+'%';
    });
    chips.slice().sort(function(a,b){
      return (parseFloat(a.dataset.p)||0)-(parseFloat(b.dataset.p)||0);
    }).forEach(function(el){ el.style.left=''; el.style.transform=''; rail.appendChild(el); });
    return;
  }

  var w=rail.getBoundingClientRect().width;

  // inset the scale so the extreme levels still sit on their own ticks
  var maxHalf=0;
  chips.forEach(function(c){ maxHalf=Math.max(maxHalf,c.getBoundingClientRect().width/2); });
  var pad=Math.min(maxHalf, w*0.22);
  var inner=Math.max(1, w-2*pad);
  function anchorFor(pct){ return pad + inner*pct/100; }

  // ticks move with the scale so chip and tick always agree
  [].slice.call(rail.querySelectorAll('.railtick')).forEach(function(t){
    t.style.left=anchorFor(parseFloat(t.dataset.pct)||0)+'px';
  });

  var cs=chips.map(function(el){
    var bw=el.getBoundingClientRect().width;
    var anchor=anchorFor(parseFloat(el.dataset.pct)||0);
    return { el:el, bw:bw, left:anchor-bw/2 };
  }).sort(function(a,b){ return a.left-b.left; });

  for(var i=1;i<cs.length;i++){
    var minL=cs[i-1].left+cs[i-1].bw+GAP;
    if(cs[i].left<minL) cs[i].left=minL;
  }
  var lastC=cs[cs.length-1];
  var shift=0;
  if(lastC.left+lastC.bw > w) shift = w-(lastC.left+lastC.bw);
  if(cs[0].left+shift < 0)     shift = -cs[0].left;
  if(shift) cs.forEach(function(c){ c.left+=shift; });
  cs.forEach(function(c){
    c.el.style.left=c.left+'px';
    c.el.style.transform='translateY(-50%)';
  });
}

// ── Gate.io candlestick fetch ─────────────────────────────────────────────────
var GATE_STEP = { '15m':900, '30m':1800, '1h':3600, '4h':14400, '8h':28800, '1d':86400 };
var GATE_MAX  = 1900;              // Gate caps a request; stay under it
var CACHE_PREFIX = 'vcc_gate_';    // only ever touch our own keys
var CACHE_KEEP = 8;

function normContract(s){
  s = (s||'').trim().toUpperCase().replace(/\.P$/,'').replace(/[\/\-\s]+/g,'_');
  if(s.indexOf('_')===-1){
    if(/USDT$/.test(s)) s = s.slice(0,-4)+'_USDT';
    else s = s+'_USDT';
  }
  return s;
}
function cacheKey(c,i,f,t){ return CACHE_PREFIX+c+'_'+i+'_'+f+'_'+t; }
function cacheRead(k){
  try{
    var raw=localStorage.getItem(k); if(!raw) return null;
    var a=JSON.parse(raw);
    if(!Array.isArray(a)||!a.length) return null;
    return a.map(function(r){ return { t:r[0],o:r[1],h:r[2],l:r[3],c:r[4],v:r[5] }; });
  }catch(e){ return null; }
}
function cacheWrite(k,cs){
  try{
    localStorage.setItem(k, JSON.stringify(cs.map(function(c){
      return [c.t,c.o,c.h,c.l,c.c,Math.round(c.v)];
    })));
    // evict our oldest entries only
    var mine=[];
    for(var i=0;i<localStorage.length;i++){
      var kk=localStorage.key(i);
      if(kk && kk.indexOf(CACHE_PREFIX)===0) mine.push(kk);
    }
    while(mine.length>CACHE_KEEP){ localStorage.removeItem(mine.shift()); }
  }catch(e){ /* quota — caching is optional */ }
}

// 20-period volume MA, which the volume pane draws
function addVolMA(cs, period){
  period = period||20;
  for(var i=0;i<cs.length;i++){
    var s=0,k=0;
    for(var j=Math.max(0,i-(period-1)); j<=i; j++){ s+=cs[j].v; k++; }
    cs[i].vma = s/k;
  }
  return cs;
}

async function fetchGate(contract, interval, fromSec, toSec){
  var url='https://api.gateio.ws/api/v4/futures/usdt/candlesticks'
        +'?contract='+encodeURIComponent(contract)
        +'&interval='+encodeURIComponent(interval)
        +'&from='+fromSec+'&to='+toSec;
  var r=await fetch(url,{ headers:{ 'Accept':'application/json' } });
  var txt=await r.text();
  if(!r.ok) throw new Error('Gate '+r.status+': '+txt.slice(0,110));
  var raw=JSON.parse(txt);
  if(!Array.isArray(raw)) throw new Error('unexpected response shape');
  if(!raw.length) throw new Error('no candles for that range');
  var out=raw.map(function(k){
    return {
      t:+k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c,
      // futures: v is contracts, sum is quote volume — the bars want quote
      v: +(k.sum!=null ? k.sum : k.v)
    };
  }).filter(function(c){ return isFinite(c.o)&&isFinite(c.c)&&isFinite(c.v); })
    .sort(function(a,b){ return a.t-b.t; });
  if(!out.length) throw new Error('candles unparseable');
  return out;
}

async function fetchBinance(contract, interval, fromSec, toSec){
  var sym=contract.replace('_','');
  var url='https://api.binance.com/api/v3/klines?symbol='+encodeURIComponent(sym)
        +'&interval='+encodeURIComponent(interval)
        +'&startTime='+(fromSec*1000)+'&endTime='+(toSec*1000)+'&limit=1000';
  var r=await fetch(url);
  var txt=await r.text();
  if(!r.ok) throw new Error('Binance '+r.status+': '+txt.slice(0,110));
  var raw=JSON.parse(txt);
  if(!Array.isArray(raw)||!raw.length) throw new Error('no candles for that range');
  return raw.map(function(k){
    return { t:Math.floor(k[0]/1000), o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[7] };
  }).filter(function(c){ return isFinite(c.o)&&isFinite(c.v); });
}

async function doLoad(){
  var btn=document.getElementById('fLoad');
  var contract=normContract(document.getElementById('fContract').value);
  var interval=document.getElementById('fInterval').value;
  if(!contract){ setStatus('enter a contract','err'); return; }
  if(!rangeStart){ showNeedDates(true); setStatus('set trade dates','err'); return; }
  if(rangeEnd===null){ setStatus('pick an end date, or Live','err'); return; }
  showNeedDates(false);
  var wantLive = rangeEnd==='live';
  var fromSec=fromSecs();
  var toSec  =toSecs();
  if(!(toSec>fromSec)){ setStatus('end must be after start','err'); return; }

  // keep the request inside Gate's per-call limit
  var step=GATE_STEP[interval]||3600;
  var srcNow=document.getElementById('fSource').value;
  var cap=srcNow==='gate'?GATE_MAX:1000;
  var bars=Math.floor((toSec-fromSec)/step);
  var trimmed=false;
  if(bars>cap){ fromSec=toSec-cap*step; trimmed=true; }

  document.getElementById('fContract').value=contract;
  btn.disabled=true;
  setStatus('loading','busy');
  var src=document.getElementById('fSource').value;
  // bucket a live window to the bar so the key is stable within a bar
  var stepK=GATE_STEP[interval]||3600;
  var keyTo=wantLive ? Math.floor(toSec/stepK)*stepK : toSec;
  var key=cacheKey(src+'_'+contract,interval,fromSec,keyTo);
  try{
    var cs=cacheRead(key), cached=!!cs;
    if(!cs){
      cs = src==='gate'
        ? await fetchGate(contract,interval,fromSec,toSec)
        : await fetchBinance(contract,interval,fromSec,toSec);
      cacheWrite(key,cs);
    }
    applyCandles(cs,contract,interval,src);
    // "Live" as the range end IS the follow switch
    if(wantLive && src!=='gate'){ autoLive=true; startLive(); }
    else { autoLive=false; stopLive(); }
    syncRangeBtn();   // dot now reflects real polling state
    var stampL=new Date().toTimeString().slice(0,8);
    var tip='<b>'+cs.length+' bars</b> loaded at <b>'+stampL+'</b>'
      +(cached?' &middot; from cache':'')+(trimmed?' &middot; trimmed to source limit':'');
    if(wantLive && src==='gate') tip+=' &middot; live polling needs Binance';
    else if(wantLive) tip+=' &middot; polling for new bars';
    setStatus(cs.length+' bars','ok',tip);
  }catch(err){
    var m=String(err.message||err);
    // Gate serves no CORS headers, so the browser kills the request outright
    if(src==='gate' && /Failed to fetch|NetworkError|Load failed/i.test(m)){
      m='Gate blocks browser requests (no CORS) — needs a proxy. Use Binance.';
    }
    setStatus(m,'err');
  }finally{
    btn.disabled=false;
  }
}

// ── Live tail polling ─────────────────────────────────────────────────────────
// Only ever refetches the newest bars and merges them, so history isn't re-pulled
// and the cache (keyed on a fixed window) is never invalidated.
async function pollTail(){
  if(!candles.length) return;
  var step=GATE_STEP[CUR_INTERVAL]; if(!step) return;
  var lastT=candles[candles.length-1].t;
  var fromSec=lastT;                       // re-request the open bar + anything after
  var toSec=Math.floor(Date.now()/1000);
  if(toSec<=fromSec) return;
  var fresh;
  try{
    fresh = CUR_SRC==='gate'
      ? await fetchGate(CUR_CONTRACT,CUR_INTERVAL,fromSec,toSec)
      : await fetchBinance(CUR_CONTRACT,CUR_INTERVAL,fromSec,toSec);
    lastPollErr=null;
  }catch(err){
    lastPollErr=String(err.message||err);
    setStatus('live: '+lastPollErr,'err');
    return;
  }
  if(!fresh || !fresh.length) return;

  // were we pinned to the right edge? if so, keep following as bars arrive
  // following = the newest bar is on screen right now (measured before appending)
  var following = (n-1) < offset + viewN;
  var added=0, updated=0;
  fresh.forEach(function(fc){
    var lastIdx=candles.length-1;
    if(candles[lastIdx] && fc.t===candles[lastIdx].t){
      candles[lastIdx].o=fc.o; candles[lastIdx].h=fc.h;
      candles[lastIdx].l=fc.l; candles[lastIdx].c=fc.c; candles[lastIdx].v=fc.v;
      updated++;
    } else if(!candles[lastIdx] || fc.t>candles[lastIdx].t){
      candles.push(fc); added++;
    }
  });
  if(!added && !updated) return;
  n=candles.length;
  addVolMA(candles);
  if(added){
    // only scroll if the new bar actually fell outside the viewport
    if(following && (n-1) >= offset + viewN){
      offset = Math.max(0, n + rightMargin(n) - viewN);
    } else {
      offset = Math.min(offset, maxOffset());
    }
  }
  draw();
  // a good poll must clear any stale error, not just report new bars
  var stamp=new Date().toTimeString().slice(0,8);
  setStatus(n+' bars'+(added? ' · +'+added : ''),'ok',
    '<b>'+n+' bars</b> &middot; updated <b>'+stamp+'</b>'
    +(added? ' &middot; <b>'+added+'</b> new bar'+(added>1?'s':'') : ''));
}

function startLive(){
  stopLive();
  var step=GATE_STEP[CUR_INTERVAL]||3600;
  // poll often enough to catch a bar close promptly, but never hammer the API
  var everyMs=Math.max(15000, Math.min(60000, step*1000/60));
  liveTimer=setInterval(pollTail, everyMs);
  pollTail();
}
function stopLive(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

// the countdown needs a tick regardless of polling
function startClock(){
  if(clockTimer) return;
  clockTimer=setInterval(function(){ if(barCountdown()!=null) draw(); },1000);
}

startClock();

function dayClass(cd, today, eEnd, inMonth){
  var cls='fday';
  var disabled=cd>today;
  if(!inMonth) cls+=' oth';
  if(disabled) cls+=' dis';
  if(sameDay(cd,today)) cls+=' today';
  var isS=sameDay(cd,rangeStart), isE=eEnd&&sameDay(cd,eEnd);
  if(isS&&isE) cls+=' solo';
  else if(isS) cls+=(eEnd||(calHover&&rangeStart && calHover>rangeStart))?' end1':' solo';
  else if(isE) cls+=' end2';
  else if(eEnd && rangeStart && cd>rangeStart && cd<eEnd) cls+=' inr';
  else if(!eEnd && rangeEnd==='live' && rangeStart && cd>rangeStart && cd<=today) cls+=' inr';
  else if(rangeEnd===null && calHover && rangeStart && cd>rangeStart && cd<calHover) cls+=' pre';
  else if(!eEnd && calHover && rangeStart && cd>rangeStart && cd<calHover) cls+=' pre';
  if(!eEnd && calHover && sameDay(cd,calHover) && rangeStart && calHover>rangeStart) cls+=' precap';
  return cls;

// The native <select> is kept in the DOM (hidden) as the state holder, so every

var SHARED_MENU=null, MENU_OWNER=null;
function sharedMenu(){
  if(!SHARED_MENU){

function initDropdown(selId,opt){
  opt=opt||{};

  sel.parentNode.insertBefore(wrap,sel);

    '<svg class="fddcv" width="9" height="6" viewBox="0 0 9 6" fill="none"><path d="M1 1l3.5 3.5L8 1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>');
  wrap.appendChild(btn);

  var menu=sharedMenu();

  function syncLabel(){
    var o=sel.options[sel.selectedIndex];
    var t=o?o.textContent:'';
    lbl.textContent=opt.fmt?opt.fmt(t):t;
  }
  function build(){
    menu.innerHTML='';
    [].forEach.call(sel.options,function(o,i){
      var it=document.createElement('button');
      it.type='button';
      it.className='fddopt'+(i===sel.selectedIndex?' sel':'');
      it.innerHTML='<svg class="fddck" width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.6L4 7.5 10 1.3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>'+o.textContent+'</span>';
      it.addEventListener('pointerdown',function(e){
        e.stopPropagation(); e.preventDefault();
        if(sel.selectedIndex!==i){
          sel.selectedIndex=i;
          sel.dispatchEvent(new Event('change',{bubbles:true}));
        }
        syncLabel();
  sel.__ddsync=syncLabel; close();
      });
      menu.appendChild(it);
    });
  }
  function place(){
    var r=btn.getBoundingClientRect();
    menu.style.minWidth=r.width+'px';
    menu.style.left=Math.round(r.left)+'px';
    menu.style.top=Math.round(r.bottom+6)+'px';
    menu.style.visibility='hidden'; menu.hidden=false;
    var mh=menu.getBoundingClientRect().height;
    if(r.bottom+6+mh > innerHeight-8) menu.style.top=Math.round(r.top-6-mh)+'px';
    var mw=menu.getBoundingClientRect().width;
    if(r.left+mw > innerWidth-8) menu.style.left=Math.round(innerWidth-8-mw)+'px';
    menu.style.visibility='';
  }
  function open(){
    closeMenu(); if(typeof closeCal==='function') closeCal();
    MENU_OWNER=btn; build(); place(); btn.classList.add('open');
  }
  function close(){ if(MENU_OWNER===btn) closeMenu(); }
  function isOpen(){ return MENU_OWNER===btn; }

  // pointerdown so the toggle wins the race with the capture-phase dismisser
  btn.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    isOpen()?close():open();
  });
  btn.addEventListener('click',function(e){ e.stopPropagation(); });
  sel.addEventListener('change',syncLabel);
  syncLabel();
  sel.__ddsync=syncLabel;
  DROPDOWNS.push({close:close, wrap:wrap, menu:menu});

}

  if(EMBED) document.documentElement.setAttribute('data-embed','1');
  if(!raw) return;
  var P; try{ P=JSON.parse(raw); }catch(e){ return; }

  if(P.contract) CUR_CONTRACT=P.contract;
  if(P.interval) CUR_INTERVAL=P.interval;
  if(P.unit || P.dir || P.qty!=null){
    POS={ dir:P.dir||POS.dir, qty:(P.qty!=null?P.qty:POS.qty), unit:P.unit||POS.unit };
  }
  if(Array.isArray(P.fills) && P.fills.length){
    FILLS=P.fills.filter(function(f){ return isFinite(f.p); }).map(function(f,i){
      return { n:i+1, p:+f.p, pct:(f.pct!=null?+f.pct:0), filled:f.filled!==false };
    });
  }
  if(Array.isArray(P.targets) || P.stop!=null || P.liq!=null){
    var TPC=['#4caf7d','#26a69a','#1f9d55','#3fbf8f','#2fa87a','#57c98a'];
    var out=[];
    // only the entry line is on by default — the rest are opt-in via the level chips
    if(isFinite(P.liq))  out.push({ id:'liq',  p:+P.liq,  col:'#df5338', label:'Liquidation', short:'Liq',  dash:[7,5], lw:1.2, on:false });
    if(isFinite(P.stop)) out.push({ id:'stop', p:+P.stop, col:'#e0663f', label:'Stop loss',   short:'Stop', dash:[7,5], lw:1.2, on:false });
    out.push({ id:'entry', p:null, col:'#7c5cff', label:'Avg entry', short:'Entry', dash:[7,5], lw:1.6, on:true });
    (P.targets||[]).forEach(function(t,i){
      if(!isFinite(t.p)) return;
      out.push({ id:'tp'+(i+1), p:+t.p, col:TPC[i%TPC.length], label:'TP'+(i+1), short:'TP'+(i+1),
                 dash:[7,5], lw:1.2, on:false, bank:(t.pct!=null?+t.pct:null) });
    });
    if(out.length>1) LEVELS=out;
  }
  if(isFinite(P.armedBar)) ARMED_AT=Math.max(0,Math.round(P.armedBar));
  if(P.needDates) NEED_DATES=true;
  if(P.start){
    var sd=new Date(P.start);
    if(!isNaN(sd)) rangeStart=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate());
  }
  if(P.end && P.end!=='live'){
    var ed=new Date(P.end);
    if(!isNaN(ed)) rangeEnd=new Date(ed.getFullYear(),ed.getMonth(),ed.getDate());
  }
  // reflect the handed-in contract/interval in the header controls
  try{
    document.getElementById('fContract').value=CUR_CONTRACT;
    var si=document.getElementById('fInterval');
    for(var oi=0;oi<si.options.length;oi++) if(si.options[oi].textContent.trim()===CUR_INTERVAL) si.selectedIndex=oi;
    if(typeof syncContract==='function') syncContract();
    if(si.__ddsync) si.__ddsync();
  }catch(e){}
})();

// ── Boot ──────────────────────────────────────────────────────────────────────
resize();
// seed the strip from the embedded series so the count is never blank,
// then refresh against the live source the header is advertising
syncRangeBtn();
if(NEED_DATES || !rangeStart){
  showNeedDates(true);
  setStatus('set trade dates','err','Set a <b>start</b> date on the plan to load its chart');
} else {
  setStatus(n+' bars','ok','<b>'+n+' bars</b> from the bundled series');
  doLoad();
}
</script>
</body>
</html>
